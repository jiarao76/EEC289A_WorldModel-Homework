seed: 289
device: auto
torch_num_threads: 1

model:
  hidden_dim: 384       # wider: more capacity for accurate single-step prediction
  num_layers: 4
  use_gru: false
  delta_limit: 0.5

training:
  batch_size: 512       # larger batch = more stable gradient estimate per step
  updates: 8000
  smoke_updates: 120
  train_sequence_length: 256
  learning_rate: 5.0e-4  # higher LR to escape plateau
  grad_clip_norm: 5.0
  eval_every: 400
  smoke_eval_every: 20
  val_horizon: 500
  max_val_windows: 128
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max

loss:
  one_step_weight: 2.0   # emphasise single-step accuracy more than before
  rollout_weight: 1.0    # lighter rollout so one-step loss dominates early on
  rollout_train_horizon: 100

eval:
  warmup_steps: 10
  horizon: auto
  max_horizon: 1000
  report_horizons: [1, 5, 10, 90, 100, 200, 500, 1000]
  vpt_thresholds: [0.10, 0.25, 0.50]
