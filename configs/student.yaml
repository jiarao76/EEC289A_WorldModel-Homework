seed: 289
device: auto
torch_num_threads: 1

model:
  hidden_dim: 256
  num_layers: 4
  use_gru: false
  delta_limit: 0.5

training:
  batch_size: 256
  updates: 8000
  smoke_updates: 120
  train_sequence_length: 256   # warmup(10) + rollout_horizon(200) + 1 = 211
  learning_rate: 3.0e-4
  grad_clip_norm: 5.0
  eval_every: 400
  smoke_eval_every: 20
  val_horizon: 500
  max_val_windows: 128
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max

loss:
  one_step_weight: 1.0
  rollout_weight: 3.0
  rollout_train_horizon: 200
  # Scheduled Sampling: teacher_forcing_ratio anneals from 0.8 → 0 over 4000 steps
  # Early training uses 80% ground-truth states → stable gradients
  # Late training uses pure open-loop → model learns to handle its own errors
  ss_start: 0.8
  ss_anneal_steps: 4000

eval:
  warmup_steps: 10
  horizon: auto
  max_horizon: 1000
  report_horizons: [1, 5, 10, 90, 100, 200, 500, 1000]
  vpt_thresholds: [0.10, 0.25, 0.50]
