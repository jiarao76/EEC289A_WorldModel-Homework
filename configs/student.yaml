seed: 289
device: auto
torch_num_threads: 4

model:
  hidden_dim: 256
  num_layers: 4
  use_gru: true

training:
  batch_size: 256
  updates: 8000
  smoke_updates: 120
  train_sequence_length: 300
  learning_rate: 5.0e-4
  grad_clip_norm: 5.0
  eval_every: 400
  smoke_eval_every: 20
  val_horizon: 800
  max_val_windows: 256
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max

loss:
  one_step_weight: 1.0
  rollout_weight: 2.0
  rollout_train_horizon: 80
  rollout_gamma: 0.97
  velocity_weight: 0.05

eval:
  warmup_steps: 10
  horizon: auto
  max_horizon: 1000
  report_horizons: [1, 5, 10, 90, 100, 200, 500, 1000]
  vpt_thresholds: [0.10, 0.25, 0.50]
