seed: 42
device: auto
torch_num_threads: 4

model:
  hidden_dim: 384
  num_layers: 5
  use_gru: true

training:
  batch_size: 256
  updates: 12000
  smoke_updates: 120
  train_sequence_length: 400
  learning_rate: 2.0e-4
  grad_clip_norm: 2.0
  eval_every: 500
  smoke_eval_every: 20
  val_horizon: 800
  max_val_windows: 256
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max

loss:
  one_step_weight: 1.0
  rollout_weight: 3.0
  rollout_train_horizon: 120
  rollout_gamma: 0.98
  velocity_weight: 0.05
  early_failure_weight: 1.5

eval:
  warmup_steps: 10
  horizon: auto
  max_horizon: 1000
  report_horizons: [1, 5, 10, 90, 100, 200, 500, 1000]
  vpt_thresholds: [0.10, 0.25, 0.50]
