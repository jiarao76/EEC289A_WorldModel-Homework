seed: 289
device: auto
torch_num_threads: 1

model:
  hidden_dim: 256
  num_layers: 3
  use_gru: true

training:
  batch_size: 128
  updates: 6000        # 从 checkpoint 继续再跑 6000 步
  smoke_updates: 120
  train_sequence_length: 200   # warmup(10) + horizon(150) + margin(40)
  learning_rate: 1.0e-4        # 从 checkpoint 继续时用更小 LR
  grad_clip_norm: 5.0
  eval_every: 500
  smoke_eval_every: 20
  val_horizon: 500
  max_val_windows: 128
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max

loss:
  one_step_weight: 1.0
  rollout_weight: 1.5
  rollout_train_horizon: 150
  rollout_horizon_start: 80    # 直接从 80 开始，跳过已经学会的部分
  rollout_curriculum_steps: 2000  # 2000 步内从 80 爬到 150

eval:
  warmup_steps: 10
  horizon: auto
  max_horizon: 1000
  report_horizons: [1, 5, 10, 90, 100, 200, 500, 1000]
  vpt_thresholds: [0.10, 0.25, 0.50]
