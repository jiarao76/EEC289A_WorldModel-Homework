device: auto
eval:
  horizon: auto
  max_horizon: 1000
  report_horizons:
  - 1
  - 5
  - 10
  - 90
  - 100
  - 200
  - 500
  - 1000
  vpt_thresholds:
  - 0.1
  - 0.25
  - 0.5
  warmup_steps: 10
loss:
  one_step_weight: 1.0
  rollout_curriculum_steps: 2000
  rollout_horizon_start: 5
  rollout_train_horizon: 80
  rollout_weight: 1.5
model:
  hidden_dim: 256
  num_layers: 3
  use_gru: true
seed: 137
torch_num_threads: 1
training:
  batch_size: 128
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max
  eval_every: 500
  grad_clip_norm: 5.0
  learning_rate: 0.0003
  max_val_windows: 128
  smoke_eval_every: 20
  smoke_updates: 120
  train_sequence_length: 120
  updates: 12000
  val_horizon: 500
