seed: 289
device: auto
torch_num_threads: 1

model:
  hidden_dim: 256
  num_layers: 4
  use_gru: false
  delta_limit: 0.5

training:
  batch_size: 128               # smaller batch to fit longer sequences in GPU memory
  updates: 8000
  smoke_updates: 120
  train_sequence_length: 512    # warmup(10) + rollout_horizon(400) + 1 = 411; 512 gives slack
  learning_rate: 2.0e-4
  grad_clip_norm: 2.0           # tighter clip for long-horizon gradient stability
  eval_every: 400
  smoke_eval_every: 20
  val_horizon: 500
  max_val_windows: 128
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max

loss:
  one_step_weight: 1.0
  rollout_weight: 5.0           # dominant term: force long-horizon stability
  rollout_train_horizon: 400    # cover 400 of the 500 val steps directly

eval:
  warmup_steps: 10
  horizon: auto
  max_horizon: 1000
  report_horizons: [1, 5, 10, 90, 100, 200, 500, 1000]
  vpt_thresholds: [0.10, 0.25, 0.50]
