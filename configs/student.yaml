seed: 289
device: auto
torch_num_threads: 1

model:
  hidden_dim: 256
  num_layers: 3
  use_gru: true

training:
  batch_size: 128
  updates: 8000
  smoke_updates: 120
  train_sequence_length: 192   # warmup(10) + horizon(150) + margin(32)
  learning_rate: 3.0e-4
  grad_clip_norm: 5.0
  eval_every: 500
  smoke_eval_every: 20
  val_horizon: 500
  max_val_windows: 128
  checkpoint_metric: val/VPT80@0.25
  checkpoint_mode: max

loss:
  one_step_weight: 0.5         # 降低单步权重，单步已经够好了
  rollout_weight: 3.0          # 大幅提升 rollout 权重，强迫解决累积误差
  rollout_train_horizon: 150   # 从 50 增大到 150，覆盖更长 horizon
  rollout_horizon_start: 10
  rollout_curriculum_steps: 2000

eval:
  warmup_steps: 10
  horizon: auto
  max_horizon: 1000
  report_horizons: [1, 5, 10, 90, 100, 200, 500, 1000]
  vpt_thresholds: [0.10, 0.25, 0.50]
